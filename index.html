<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bassa9 Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .title {
            text-align: center;
            color: white;
            font-size: 3em;
            margin: 40px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            cursor: pointer;
            aspect-ratio: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
            background: white;
        }
        
        .gallery-item:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .gallery-item:hover img {
            transform: scale(1.15);
        }
        
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .lightbox.active { display: flex; }
        
        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(255,255,255,0.2);
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 50px;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.3s;
        }
        
        .lightbox-close:hover {
            transform: rotate(90deg);
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: white;
            opacity: 0.9;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">✨ Bassa9 Gallery ✨</h1>
        
        <div class="gallery">
            <div class="gallery-item"><img src="photo1.jpg" alt="صورة 1"></div>
            <div class="gallery-item"><img src="photo2.jpg" alt="صورة 2"></div>
            <div class="gallery-item"><img src="photo3.jpg" alt="صورة 3"></div>
            <div class="gallery-item"><img src="photo4.jpg" alt="صورة 4"></div>
            <div class="gallery-item"><img src="photo5.jpg" alt="صورة 5"></div>
            <div class="gallery-item"><img src="photo6.jpg" alt="صورة 6"></div>
            <div class="gallery-item"><img src="photo7.jpg" alt="صورة 7"></div>
            <div class="gallery-item"><img src="photo8.jpg" alt="صورة 8"></div>
            <div class="gallery-item"><img src="photo9.jpg" alt="صورة 9"></div>
            <div class="gallery-item"><img src="photo10.jpg" alt="صورة 10"></div>
        </div>
        
        <footer>
            <p>© 2026 Bassa9 - جميع الحقوق محفوظة</p>
        </footer>
    </div>
    
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="">
    </div>
    
    <script>
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        
        galleryItems.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });
        
        function closeLightbox() {
            lightbox.classList.remove('active');
        }
        
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
    </script>
</body>
</html>
