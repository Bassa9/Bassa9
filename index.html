<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع Bassa9 الشخصي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* الهيدر */
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid white;
            object-fit: cover;
            background-color: #ddd;
            margin-bottom: 20px;
        }
        h1 { font-size: 2.5em; margin-bottom: 15px; }
        .bio { font-size: 1.1em; max-width: 600px; margin: 0 auto 20px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: white;
            color: #1e3c72;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
        }
        
        /* معرض الصور */
        .gallery-title {
            text-align: center;
            font-size: 2em;
            margin: 40px 0 25px;
            border-bottom: 3px solid white;
            padding-bottom: 10px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            padding: 10px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            aspect-ratio: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <img src="profile.jpg" alt="صورتي" class="profile-img" onerror="this.src='https://via.placeholder.com/180'">
            <h1>مرحباً، أنا Bassa9</h1>
            <p class="bio">أهلاً بك في موقعي الشخصي. أنا مهتم بالتكنولوجيا والتعلم المستمر، وهذا هو مشروعي الأول على الإنترنت.</p>
            <a href="https://github.com/Bassa9" class="btn">حسابي على GitHub</a>
        </div>
        
        <!-- معرض الصور -->
        <h2 class="gallery-title">معرض صوري</h2>
        <div class="gallery">
            <div class="gallery-item"><img src="photo1.jpg" alt="صورة 1"></div>
            <div class="gallery-item"><img src="photo2.jpg" alt="صورة 2"></div>
            <div class="gallery-item"><img src="photo3.jpg" alt="صورة 3"></div>
            <div class="gallery-item"><img src="photo4.jpg" alt="صورة 4"></div>
            <div class="gallery-item"><img src="photo5.jpg" alt="صورة 5"></div>
            <div class="gallery-item"><img src="photo6.jpg" alt="صورة 6"></div>
            <div class="gallery-item"><img src="photo7.jpg" alt="صورة 7"></div>
            <div class="gallery-item"><img src="photo8.jpg" alt="صورة 8"></div>
            <div class="gallery-item"><img src="photo9.jpg" alt="صورة 9"></div>
            <div class="gallery-item"><img src="photo10.jpg" alt="صورة 10"></div>
        </div>
        
        <footer>
            <p>© 2026 Bassa9 - جميع الحقوق محفوظة</p>
        </footer>
    </div>
    
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="">
    </div>
    
    <script>
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        
        galleryItems.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });
        
        function closeLightbox() {
            lightbox.classList.remove('active');
        }
        
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
    </script>
</body>
</html>
