<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيسو البلد</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06070a;--ink:#e9f4ff;--mute:#8fa3c4;--a:#ff6a3d;--b:#ffb347;--glass:rgba(16,14,14,.58);--line:rgba(255,106,61,.32);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;line-height:1.8;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 38%,rgba(4,5,8,.85) 100%),linear-gradient(180deg,rgba(4,5,8,.2),rgba(4,5,8,.45) 65%,rgba(4,5,8,.82))}
main{position:relative;z-index:2;max-width:1020px;margin:auto;padding:0 20px}
h1,h2{font-family:'Lalezar',Tahoma,sans-serif;margin:0;line-height:1.1}
.hero{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 26px) 0 40px;display:flex;flex-direction:column;justify-content:flex-start;gap:10px}
.hero small{color:var(--a);font-size:1.05rem}
h1{font-weight:400;letter-spacing:.01em;font-size:clamp(3.4rem,13vw,8rem);position:relative;display:inline-block;text-shadow:0 0 40px rgba(255,90,40,.55),0 4px 30px #000}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
h1::before{color:var(--a);transform:translateX(3px);animation:gl 3.2s steps(1) infinite;clip-path:inset(0 0 60% 0)}
h1::after{color:var(--b);transform:translateX(-3px);animation:gl 2.6s steps(1) infinite reverse;clip-path:inset(60% 0 0 0)}
@keyframes gl{0%,88%{opacity:0}90%{opacity:.8;transform:translateX(6px)}94%{opacity:.8;transform:translateX(-6px)}100%{opacity:0}}
.hint{color:var(--mute);font-size:.95rem;margin-top:8px}
.stage{width:100%;aspect-ratio:1;transition:transform .2s;will-change:transform}
#dr{width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 64%,transparent 100%);mask-image:radial-gradient(closest-side,#000 64%,transparent 100%);filter:drop-shadow(0 0 40px rgba(61,184,255,.35))}
.bar{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:640px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 10px;background:rgba(8,14,30,.7);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;box-shadow:0 0 30px -8px var(--a)}
.bar .play{width:44px;height:44px;font-size:1rem;box-shadow:0 0 18px var(--a)}
.bar .meta{flex:1;min-width:0;line-height:1.3}
.bar strong{font-size:.95rem}
#viz{height:26px;margin-top:2px}
.bar .pick{margin:0;font-size:.85rem;white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.player{margin-top:16px;flex-wrap:wrap}
.viz{width:100%;height:30px;display:block;margin-top:4px}
.player .pick{margin:0;font-size:.85rem;white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.player .play{width:48px;height:48px;font-size:1.05rem}
.blaze{position:relative;text-align:center;font-family:'Lalezar',Tahoma,sans-serif;font-size:clamp(2.4rem,9.4vw,5rem);line-height:1.4;padding:16px 2px}
.blaze::before{content:"";position:absolute;inset:-30% -12%;background:radial-gradient(ellipse,rgba(255,90,20,.38),transparent 65%);animation:glow 1.7s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{opacity:.5;transform:scale(1.07)}}
.blaze .main{position:relative;z-index:2;display:inline-block;background:linear-gradient(180deg,#fffbe6 0%,#ffe9a0 45%,#ffbf45 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.85)) drop-shadow(0 0 12px rgba(255,120,20,.9))}
.blaze .ghost{position:absolute;z-index:1;left:0;right:0;top:16px;display:block;color:transparent;background:linear-gradient(0deg,#ff2a00 0%,#ff7a00 38%,#ffc83a 75%,#fff0a0 100%);background-size:100% 240%;-webkit-background-clip:text;background-clip:text;animation:fire 2.2s ease-in-out infinite alternate;filter:url(#flame) blur(1.5px) drop-shadow(0 -6px 22px #ff3d00);transform:scale(1.035) translateY(-4px);opacity:.95;pointer-events:none}
@keyframes fire{from{background-position:0 0}to{background-position:0 100%}}
.flame{z-index:0;position:absolute;left:0;top:-40%;width:100%;height:180%;pointer-events:none}
section{padding:44px 0}
h2{font-size:2.1rem;margin-bottom:20px}
.term{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:620px;font-size:1.15rem;box-shadow:0 0 50px -20px var(--a)}
.term i{display:inline-block;width:9px;height:1.1em;background:var(--a);vertical-align:-.15em;margin-inline-start:4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;perspective:900px}
.namewrap{margin-top:clamp(120px,38vh,420px)}
.namerow{display:flex;align-items:center;gap:6px;min-width:0}.namerow h1{min-width:0}
.pdrag{flex:none;width:clamp(88px,23vw,136px);height:auto;overflow:visible;filter:drop-shadow(0 0 8px rgba(255,106,61,.55))}
.pdrag .bob{animation:bob 1s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}
.pdrag .wing{transform-origin:58px 48px;animation:flap .55s ease-in-out infinite alternate}.pdrag .wb{animation-delay:-.12s}
@keyframes flap{from{transform:rotate(-28deg)}to{transform:rotate(16deg)}}
.pdrag .tail{transform-origin:34px 64px;animation:sway 1.5s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.pdrag .fire{transform-origin:108px 34px;animation:burn 3.4s infinite}
@keyframes burn{0%,56%{opacity:0;transform:scaleX(.2)}62%{opacity:1;transform:scaleX(1.1)}68%{transform:scaleX(.75)}74%{transform:scaleX(1.2)}88%{opacity:1;transform:scaleX(.9)}100%{opacity:0;transform:scaleX(.2)}}
.pdrag .eye{animation:pulse 1.6s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.8}}
@media(prefers-reduced-motion:reduce){.pdrag *{animation:none!important}}
.ph{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;color:var(--mute);text-align:center;padding:10px;transition:transform .15s,box-shadow .3s}
.ph:hover{box-shadow:0 0 40px -6px var(--a)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph:focus-visible,button:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.player{display:flex;align-items:center;gap:16px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:14px;max-width:560px}
.play{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--a),#2a5cff);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 0 28px var(--a)}
.meta{flex:1;min-width:0}
.meta strong{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viz{width:100%;height:46px;display:block;margin-top:4px}
.pick{display:inline-block;margin-top:14px;color:var(--a);cursor:pointer;text-decoration:underline}
footer{padding:50px 0 70px;color:var(--mute);text-align:center}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){h1::before,h1::after,.term i{animation:none}}
</style>
</head>
