<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بيسو البلد</title>
<meta name="description" content="وجودك هنا يعني إنك رأيت أعظم رجل في العالم 🔥🐉">
<meta property="og:type" content="website">
<meta property="og:title" content="بيسو البلد 🔥">
<meta property="og:description" content="وجودك هنا يعني إنك رأيت أعظم رجل في العالم. ادخل عالمي 🐉">
<meta property="og:image" content="https://bassa9.github.io/dragon.jpg">
<meta property="og:url" content="https://bassa9.github.io">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0806">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ember:#ff6a1a; --gold:#ffd76a; --blood:#b3170f; --ash:#0b0806; --smoke:#f3e8d8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--smoke);background:var(--ash);overflow-x:hidden}
body.locked{overflow:hidden}

/* الخلفية */
.bgwrap{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bgmove{position:absolute;inset:-3%;transition:transform .25s ease-out}
.bg{position:absolute;inset:0;
  background:url('dragon.jpg') center 30%/cover no-repeat,linear-gradient(180deg,#1a1208,#0b0806);
  animation:breathe 16s ease-in-out infinite alternate;will-change:transform}
@keyframes breathe{from{transform:scale(1.02);filter:brightness(1.05) contrast(1.08)}to{transform:scale(1.1) translateY(-1.5%);filter:brightness(1.22) contrast(1.12)}}
.bg::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.6) 100%),
             linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.08) 40%,rgba(0,0,0,.78))}
.fog{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 28% at 20% 80%,rgba(255,255,255,.11),transparent),radial-gradient(50% 25% at 80% 68%,rgba(255,255,255,.08),transparent);
  animation:fog 30s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(-8%)}}
.glow{position:fixed;left:0;right:0;bottom:0;height:35vh;z-index:-1;pointer-events:none;
  background:linear-gradient(0deg,rgba(255,80,0,.3),transparent);animation:flick 3s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.5}}
.eye{position:absolute;z-index:2;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,70,25,.95) 0%,rgba(255,40,0,.55) 25%,transparent 65%);animation:eyes 3.4s ease-in-out infinite}
@keyframes eyes{0%{opacity:.55;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}92%{opacity:.1;transform:scale(.6)}100%{opacity:.55;transform:scale(.8)}}
.pct{font-family:'Lalezar','Cairo',sans-serif;font-size:2.4rem;color:#ffd76a;text-shadow:0 0 16px #ff6a1a}
.enter[hidden]{display:none}
.type{min-height:5.5em}
.type::after{content:'▍';color:#ffb300;animation:blink .8s steps(1) infinite}
.type.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center;padding:22px 10px;border-radius:20px;background:rgba(18,9,4,.62);border:1px solid rgba(255,122,47,.45);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat b{display:block;font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:3rem;color:#ffcf4a;text-shadow:0 0 20px #ff6a1a}
.stat span{color:#e9c98c}
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flip{perspective:800px;height:175px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;
  border:1px solid rgba(255,150,0,.5);background:rgba(18,9,4,.78);box-shadow:0 0 20px rgba(255,90,0,.2)}
.ff i{font-style:normal;font-size:2.6rem}
.ff span{font-family:'Lalezar','Cairo',sans-serif;font-size:1.5rem;color:#ffd76a}
.fb{transform:rotateY(180deg);background:linear-gradient(135deg,#3a0d06,#120804);font-size:1.05rem;line-height:1.7}
.contact{display:flex;flex-wrap:wrap;gap:12px}
.cbtn{flex:1 1 150px;text-align:center;text-decoration:none;color:#1a0b00;font-family:'Lalezar','Cairo',sans-serif;font-size:1.3rem;
  padding:14px 18px;border-radius:50px;background:linear-gradient(135deg,#ffb300,#ff6a1a);box-shadow:0 0 22px rgba(255,106,26,.55);
  animation:pulseb 2.6s ease-in-out infinite}
@keyframes pulseb{50%{box-shadow:0 0 38px rgba(255,150,0,.95)}}
@media(min-width:700px){.flips{grid-template-columns:repeat(4,1fr)}}
.embers{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ember{position:absolute;bottom:-20px;border-radius:50%;
  background:radial-gradient(circle,#ffd76a,rgba(255,106,26,0));animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,0);opacity:.9}to{transform:translate(var(--dx),-110vh);opacity:0}}

/* بوابة الدخول */
.gate{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 50%,#1b0c05,#050302 70%);
  transition:opacity 1.2s ease,visibility 1.2s}
.gate.open{opacity:0;visibility:hidden}
.gate.open .portal{transform:scale(14);opacity:0}
.portal{width:150px;height:150px;border-radius:50%;position:relative;transition:transform 1.4s cubic-bezier(.7,0,.3,1),opacity 1.2s;
  background:radial-gradient(circle,#000 38%,#ff6a1a 40%,#b3170f 55%,transparent 70%);
  box-shadow:0 0 60px #ff6a1a,0 0 140px #b3170f;animation:pulse 2.4s ease-in-out infinite}
.portal::before{content:'';position:absolute;inset:-14px;border-radius:50%;
  border:2px dashed rgba(255,215,106,.7);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 90px #ff9d00,0 0 200px #b3170f}}
.gate p{font-family:'Lalezar','Cairo',sans-serif;font-size:1.15rem;color:#e9c98c;letter-spacing:.04em}
.enter{font-family:'Lalezar','Cairo',sans-serif;font-size:1.45rem;color:#1a0b00;border:0;cursor:pointer;
  padding:14px 44px;border-radius:50px;background:linear-gradient(135deg,#ffb300,#ff6a1a);
  box-shadow:0 0 30px rgba(255,106,26,.7);transition:transform .2s}
.enter:active{transform:scale(.95)}

/* الواجهة */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  text-align:center;padding:44px 16px 80px;gap:20px}
.top{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.tagline{cursor:pointer;width:min(100%,640px);padding:22px 18px;border-radius:24px;background:rgba(8,4,2,.58);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,200,100,.55);
  box-shadow:0 0 30px rgba(255,100,0,.35),inset 0 0 30px rgba(0,0,0,.4);
  font-family:'Lalezar','Cairo',sans-serif;font-size:clamp(1.6rem,6.4vw,2.6rem);line-height:1.6;color:#fff4d6;
  text-shadow:0 2px 0 #000,0 0 14px rgba(255,150,0,.7)}
.tagline b{display:block;font-weight:400;font-size:1.3em;color:#ffcf4a;
  text-shadow:0 3px 0 #7a2a00,0 0 22px #ff8a00,0 0 44px rgba(255,80,0,.8)}
.welcome{font-size:1.25rem;color:#ff8a3d;text-shadow:0 2px 10px #000;letter-spacing:.05em}
.name{font-family:'Lalezar','Cairo',sans-serif;font-size:clamp(3.6rem,17vw,8rem);line-height:1.15;
  background:linear-gradient(180deg,#fff 0%,#ffe9a8 35%,#ff7a1a 75%,#b3170f 100%);
  background-size:100% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.9)) drop-shadow(0 0 28px rgba(255,90,0,.8));
  animation:flame 4s ease-in-out infinite alternate}
@keyframes flame{from{background-position:0 0}to{background-position:0 40%}}
.scroll{position:absolute;bottom:26px;color:#e9c98c;font-size:.95rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}

.section{max-width:1040px;margin:0 auto;padding:60px 18px}
.section h2{font-family:'Lalezar','Cairo',sans-serif;font-size:2.3rem;margin-bottom:22px;color:var(--gold);
  text-shadow:0 0 18px rgba(255,120,0,.7);display:flex;align-items:center;gap:14px}
.section h2::after{content:'';flex:1;height:1px;background:linear-gradient(270deg,transparent,rgba(255,150,0,.7))}
.card{background:rgba(18,9,4,.62);border:1px solid rgba(255,122,47,.45);border-radius:22px;padding:28px;
  font-size:1.35rem;line-height:1.9;color:#f6ead9;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(255,90,0,.08)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .9s,transform .9s}
.reveal.in{opacity:1;transform:none}

/* المعرض */
.gallery{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;grid-auto-flow:dense;gap:10px}
.g{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,150,0,.4);
  background:#120a05;box-shadow:0 8px 24px rgba(0,0,0,.6);isolation:isolate}
.g img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1),filter .5s;filter:saturate(1.05) contrast(1.05)}
.g::after{content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,transparent 55%,rgba(179,23,15,.55));opacity:.7;transition:opacity .4s}
.g:hover img,.g:active img{transform:scale(1.12)}
.g:hover{border-color:var(--gold);box-shadow:0 0 28px rgba(255,120,0,.65)}
.g:hover::after{opacity:.15}
.g:nth-child(1){grid-column:span 2;grid-row:span 2}
.g:nth-child(4){grid-row:span 2}
.g:nth-child(7){grid-column:span 2}
.g:nth-child(9){grid-row:span 2}
@media(min-width:700px){
  .gallery{grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:14px}
  .g:nth-child(7){grid-column:span 2}
}

/* النافذة */
.lightbox{position:fixed;inset:0;z-index:1500;display:none;align-items:center;justify-content:center;
  background:rgba(5,2,1,.96);padding:16px}
.lightbox.active{display:flex}
.lightbox img{max-width:100%;max-height:88vh;border-radius:16px;border:2px solid var(--ember);box-shadow:0 0 60px rgba(255,90,0,.5)}
.lb-btn{position:absolute;background:rgba(0,0,0,.5);border:1px solid rgba(255,150,0,.6);color:var(--gold);
  width:50px;height:50px;border-radius:50%;font-size:26px;cursor:pointer}
.lb-close{top:18px;right:18px}.lb-prev{right:14px;top:50%}.lb-next{left:14px;top:50%}
.lb-count{position:absolute;bottom:18px;color:#e9c98c;font-size:.95rem}

/* مشغل الأغنية */
.player{margin:18px auto 0;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:50px;width:min(100%,360px);
  background:rgba(18,9,4,.75);border:1px solid rgba(255,122,47,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 24px rgba(255,90,0,.4);opacity:0;transform:translateY(-10px);transition:opacity .8s .8s,transform .8s .8s}
.player.show{opacity:1;transform:none}
.mini{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:900;width:52px;height:52px;
  border-radius:50%;border:1px solid rgba(255,122,47,.7);background:rgba(18,9,4,.85);color:var(--gold);font-size:20px;
  cursor:pointer;display:none;box-shadow:0 0 20px rgba(255,90,0,.4)}
.mini.show{display:grid;place-items:center}
.pbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;font-size:18px;color:#1a0b00;
  background:linear-gradient(135deg,#ffb300,#ff6a1a)}
.ptitle{flex:1;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px}
.eq i{width:4px;background:var(--gold);border-radius:2px;height:20%;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.player.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{50%{height:100%}}

footer{text-align:center;padding:40px 20px 100px;color:#ff8a3d;font-size:1.15rem;text-shadow:0 2px 10px #000}
button.cbtn{border:0;cursor:pointer}
.spark{position:fixed;z-index:3000;width:9px;height:9px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff6d6,#ffb300 40%,rgba(255,80,0,0) 70%);animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--sx),var(--sy)) scale(.2);opacity:0}}
.nw.pre{opacity:0}
.nw.slam{animation:slam 1s cubic-bezier(.2,.9,.2,1) both}
@keyframes slam{0%{opacity:0;transform:scale(3.2);filter:blur(18px)}60%{opacity:1;transform:scale(.94);filter:blur(0)}80%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.hero.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}
.roll{height:2.2em;margin-top:6px;font-family:'Lalezar','Cairo',sans-serif;font-size:1.7rem;color:#ffcf4a;
  text-shadow:0 0 18px #ff8a00,0 2px 0 #000;transition:opacity .5s,transform .5s}
.roll.out{opacity:0;transform:translateY(10px)}
.bolt{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse at var(--bx,50%) 0%,rgba(200,220,255,.9),rgba(120,150,255,.25) 40%,transparent 70%)}
.bolt.go{animation:bolt .7s}
@keyframes bolt{0%{opacity:0}8%{opacity:1}16%{opacity:.1}26%{opacity:.9}100%{opacity:0}}
.tl{position:relative;padding-right:34px}
.tl::before{content:'';position:absolute;right:11px;top:6px;bottom:6px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,#ffd76a,#ff6a1a,#b3170f);box-shadow:0 0 14px #ff6a1a}
.ti{position:relative;margin-bottom:18px;opacity:0;transform:translateX(30px);transition:opacity .7s,transform .7s}
.ti.in{opacity:1;transform:none}
.ti::before{content:'';position:absolute;right:-29px;top:20px;width:15px;height:15px;border-radius:50%;background:#ffd76a;
  box-shadow:0 0 14px #ff9d00,0 0 0 4px rgba(255,106,26,.4)}
.ti .card{font-size:1.15rem;padding:18px}
.ti b{font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:1.6rem;color:#ffcf4a;display:block}
.qrbox{position:fixed;inset:0;z-index:1600;display:none;align-items:center;justify-content:center;background:rgba(5,2,1,.92)}
.qrbox.active{display:flex}
.qrin{background:#fff;color:#1a0b00;padding:20px;border-radius:22px;text-align:center;box-shadow:0 0 60px rgba(255,90,0,.6)}
.qrin p{margin-top:12px;font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body class="locked">
<div class="bgwrap"><div class="bgmove" id="bgmove"><div class="bg" id="bg"></div></div></div>
<div class="fog"></div><div class="glow"></div><div class="bolt" id="bolt"></div>
<div class="embers" id="embers"></div>

<div class="gate" id="gate">
  <div class="portal"></div>
  <div class="pct" id="pct">0%</div>
  <p id="gateMsg">جارٍ إشعال النار...</p>
  <button class="enter" id="enterBtn" hidden>ادخل العالم 🔥</button>
</div>

<header class="hero">
  <div class="top">
    <div class="tagline">وجودك هنا يعني إنك رأيت<b>أعظم رجل في العالم</b></div>
  </div>
  <div>
    <div class="welcome">مرحباً بيك في عالمي</div>
    <div class="nw pre" id="nw"><h1 class="name">بيسو البلد</h1></div>
    <div class="roll" id="roll"></div>
    <div class="player" id="player">
      <button class="pbtn" id="playBtn" aria-label="تشغيل / إيقاف">⏸</button>
      <div class="ptitle" id="songTitle"></div>
      <div class="eq"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="scroll">▼</div>
</header>

<main>
  <section class="section reveal">
    <h2>عني</h2>
    <div class="card type" data-text="إما أن تكون أسطورة، أو لا تكون شيئاً على الإطلاق."></div>
  </section>

  <section class="section reveal">
    <h2>أرقامي</h2>
    <div class="stats">
      <div class="stat"><b id="days">0</b><span>يوم وأنا أسطورة</span></div>
      <div class="stat"><b id="visit">0</b><span>زيارتك لعالمي</span></div>
      <div class="stat"><b id="aura">0</b><span>مستوى الهيبة %</span></div>
      <div class="stat"><b id="photos">0</b><span>صورة في المعرض</span></div>
    </div>
  </section>

  <section class="section reveal">
    <h2>ألقابي</h2>
    <div class="flips" id="flips"></div>
  </section>

  <section class="section reveal">
    <h2>رحلتي</h2>
    <div class="tl" id="tl"></div>
  </section>

  <section class="section reveal">
    <h2>صوري</h2>
    <div class="gallery" id="gallery">
      <div class="g"><img src="photo1.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo2.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo3.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo4.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo5.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo6.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo7.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo8.png" alt="" loading="lazy"></div>
      <div class="g"><img src="photo9.jpg" alt="" loading="lazy"></div>
      <div class="g"><img src="photo10.jpg" alt="" loading="lazy"></div>
    </div>
  </section>

  <section class="section reveal">
    <h2>تواصل معي</h2>
    <div class="contact" id="contact"></div>
    <div class="contact" id="share" style="margin-top:14px"></div>
  </section>
</main>

<footer>صُنع بنار • بيسو البلد 🔥</footer>

<button class="mini" id="mini" aria-label="الأغنية">⏸</button>
<div class="qrbox" id="qrbox"><div class="qrin"><div id="qrcode"></div><p>امسح الكود وادخل العالم 🔥</p></div></div>
<audio id="audio" loop preload="auto"></audio>

<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" id="lbClose" aria-label="إغلاق">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="السابق">›</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="التالي">‹</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
/* ====== غيّر الأغنية من هنا ======
   1) ارفع ملف الأغنية في نفس مكان index.html
   2) اكتب اسم الملف هنا، واسم الأغنية اللي يظهر للزائر */
const SONG_FILE  = 'song.m4a';
const SONG_TITLE = '🎵 اسم الأغنية هنا';
const VOICE_FILE = 'voice.mp3';   // تسجيل صوتك للوصف (ارفعه بنفس الاسم)
const VOICE_PITCH = 0.85;           // 1 = صوتك العادي، أقل = أعمق وأتقل وأرعب (جرب 0.8 لـ 0.9)
const VOICE_GRIT  = 3;              // خشونة الصوت (0 = نضيف، 3 = وحش، 6 = قوي جدًا)
const START_DATE = '2026-01-01';   // تاريخ بداية الأسطورة (سنة-شهر-يوم)

  { label: 'واتساب 💬',   url: 'https://wa.me/201000000000' },

// عيون التنين (بتتحدد أوتوماتيك من الصورة)
const bgEl = document.getElementById('bg');
let eyes = [];
function detectEyes() {
  try {
    const w = 160, h = Math.round(w * bgImg.naturalHeight / bgImg.naturalWidth);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.drawImage(bgImg, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data, L = [0,0,0], R = [0,0,0];
    for (let j = 0; j < h * .55; j++) for (let i = 0; i < w; i++) {
      const k = (j * w + i) * 4, r = d[k], g = d[k+1], b = d[k+2];
      if (r > 110 && r - Math.max(g, b) > 70) { const t = i < w / 2 ? L : R; t[0] += i; t[1] += j; t[2]++; }
    }
    if (L[2] < 2 || R[2] < 2) return [];
    return [L, R].map(t => ({ x: t[0] / t[2] / w, y: t[1] / t[2] / h }));
  } catch (e) { return []; }
}
function placeEyes() {
  if (!bgImg.naturalWidth) return;
  if (!eyes.length) eyes = detectEyes().map(pt => { const e = document.createElement('i'); e.className = 'eye'; bgEl.appendChild(e); return { e, pt }; });
  const W = bgEl.offsetWidth, H = bgEl.offsetHeight, s = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
  const iw = bgImg.naturalWidth * s, ih = bgImg.naturalHeight * s, ox = (W - iw) / 2, oy = (H - ih) * .3, z = W * .1;
  eyes.forEach(({ e, pt }) => {
    e.style.left = (ox + pt.x * iw - z / 2) + 'px'; e.style.top = (oy + pt.y * ih - z / 2) + 'px';
    e.style.width = e.style.height = z + 'px';
  });
}
addEventListener('resize', placeEyes);

// صوتك على الوصف بتأثيرات فخمة (باص + صدى + قاعة)
const voiceData = fetch(VOICE_FILE).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }).catch(() => null);
async function playVoice() {
  try {
    const data = await voiceData; if (!data) return;
    const A = new (window.AudioContext || window.webkitAudioContext)();
    if (A.state === 'suspended') await A.resume();
    const buf = await A.decodeAudioData(data.slice(0));
    const src = A.createBufferSource(); src.buffer = buf; src.playbackRate.value = VOICE_PITCH;
    const sh = A.createWaveShaper(), cv = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; cv[i] = (1 + VOICE_GRIT) * x / (1 + VOICE_GRIT * Math.abs(x)); }
    sh.curve = cv;
    const low = A.createBiquadFilter(); low.type = 'lowshelf'; low.frequency.value = 220; low.gain.value = 8;
    const high = A.createBiquadFilter(); high.type = 'highshelf'; high.frequency.value = 3500; high.gain.value = 3;
    const comp = A.createDynamicsCompressor();
    const master = A.createGain(); master.gain.value = 1.25;
    src.connect(sh); sh.connect(low); low.connect(high); high.connect(comp); comp.connect(master);
    // قاعة (reverb)
    const len = A.sampleRate * 2.6, ir = A.createBuffer(2, len, A.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const conv = A.createConvolver(); conv.buffer = ir;
    const wet = A.createGain(); wet.gain.value = .45;
    comp.connect(conv); conv.connect(wet); wet.connect(master);
    // صدى خفيف
    const dl = A.createDelay(); dl.delayTime.value = .2;
    const fb = A.createGain(); fb.gain.value = .28; const ew = A.createGain(); ew.gain.value = .22;
    comp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(ew); ew.connect(master);
    master.connect(A.destination);
    // خفض الأغنية أثناء الكلام
    audio.volume = .22;
    src.start();
    setTimeout(() => {
      const iv = setInterval(() => { audio.volume = Math.min(1, audio.volume + .06); if (audio.volume >= 1) clearInterval(iv); }, 120);
      setTimeout(() => A.close(), 3000);
    }, (buf.duration / VOICE_PITCH + 1.2) * 1000);
  } catch (e) { audio.volume = 1; }
}
document.querySelector('.tagline').addEventListener('click', playVoice);

// صوت زئير ونار (مصنوع بالكود، مش محتاج ملف)
function roar() {
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)(), t = A.currentTime;
    const g = A.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.5, t + .25); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);
    const f = A.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(120, t + 1.8);
    g.connect(f); f.connect(A.destination);
    const o = A.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + 1.8);
    o.connect(g); o.start(t); o.stop(t + 1.9);
    const nb = A.createBuffer(1, A.sampleRate * 1.8, A.sampleRate), dd = nb.getChannelData(0);
    for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / dd.length);
    const sr = A.createBufferSource(); sr.buffer = nb; sr.connect(g); sr.start(t);
  } catch (e) {}
}
