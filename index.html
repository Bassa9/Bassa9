<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيسو البلد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: white;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .title {
            text-align: center;
            color: #ffd700;
            font-size: 4em;
            margin: 40px 0 20px;
            font-weight: bold;
        }
        
        .caption {
            text-align: center;
            color: white;
            font-size: 1.5em;
            margin: 20px auto 40px;
            max-width: 800px;
            padding: 20px;
            background: rgba(255,215,0,0.1);
            border: 2px solid #ffd700;
            border-radius: 10px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        
        .gallery-item {
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-radius: 10px;
            background: #333;
            border: 2px solid #ffd700;
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #ffd700;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">بيسو البلد</h1>
        
        <div class="caption">
            إما أن تكون أسطورة، أو لا تكون شيئاً على الإطلاق
        </div>
        
        <div class="gallery">
            <div class="gallery-item"><img src="photo1.jpg" alt="صورة 1"></div>
            <div class="gallery-item"><img src="photo2.jpg" alt="صورة 2"></div>
            <div class="gallery-item"><img src="photo3.jpg" alt="صورة 3"></div>
            <div class="gallery-item"><img src="photo4.jpg" alt="صورة 4"></div>
            <div class="gallery-item"><img src="photo5.jpg" alt="صورة 5"></div>
            <div class="gallery-item"><img src="photo6.jpg" alt="صورة 6"></div>
            <div class="gallery-item"><img src="photo7.jpg" alt="صورة 7"></div>
            <div class="gallery-item"><img src="photo8.png" alt="صورة 8"></div>
            <div class="gallery-item"><img src="photo9.jpg" alt="صورة 9"></div>
            <div class="gallery-item"><img src="photo10.jpg" alt="صورة 10"></div>
        </div>
        
        <footer>
            <p>BASSA9</p>
        </footer>
    </div>
</body>
</html>
